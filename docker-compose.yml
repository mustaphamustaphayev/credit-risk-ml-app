version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: credit_risk_backend
    ports:
      - "8000:8000"
    restart: always

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: credit_risk_frontend
    ports:
      - "8501:8501"
    environment:
      - BACKEND_URL=http://backend:8000/predict
    depends_on:
      - backend
    restart: always
    